name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Supersede in-flight runs for the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Validate ───────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras

      - name: Ruff lint gate
        run: uv run ruff check src tests

  # ── Stage 2: Unit Tests ─────────────────────────────────────────────────
  # CI runs unit jobs directly on the GitHub runner for speed. Local development
  # and verification should still use the docker compose commands documented in
  # AGENTS.md.
  backend-unit:
    name: Backend unit (pytest + 100% coverage)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras

      # pytest's addopts enforce --cov-fail-under=100 and exclude e2e/docker tests.
      - name: Pytest + coverage gate
        run: uv run pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  frontend-unit:
    name: Frontend unit (vitest)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run vitest
        run: npx vitest run
        working-directory: frontend

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-test-results
          path: frontend/test-results/
          retention-days: 7

  # ── Stage 3: A11y Smoke (axe-core) ──────────────────────────────────────
  a11y:
    name: A11y smoke (axe-core)
    needs: [backend-unit, frontend-unit]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ── Backend setup ──
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync backend dependencies
        run: uv sync --frozen --all-extras

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Start backend server
        run: |
          mkdir -p tmp/e2e-tests tmp/e2e-artifacts
          uv run uvicorn qarunner.api.app:app --port 8000 &
        env:
          QARUNNER_DB_PATH: /tmp/qarunner-a11y.db
          QARUNNER_SECRET_KEY: ci-test-key-2026!
          QARUNNER_ADMIN_PASSWORD: ci-test-pass-2026!
          QARUNNER_TESTS_ROOT: ${{ github.workspace }}/tmp/e2e-tests
          QARUNNER_ARTIFACTS_ROOT: ${{ github.workspace }}/tmp/e2e-artifacts
          QARUNNER_CRASH_RECOVERY_ON_STARTUP: "false"

      - name: Wait for backend
        run: curl --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8000/health

      - name: Start frontend dev server
        run: npx vite --port 5173 &
        working-directory: frontend
        env:
          VITE_BACKEND_URL: http://localhost:8000

      - name: Wait for frontend
        run: curl --retry 10 --retry-delay 2 --retry-all-errors http://localhost:5173

      - name: Playwright axe smoke
        run: npx playwright test --project=chromium-authed-admin tests-e2e/a11y-axe.authed-admin.spec.ts
        working-directory: frontend
        env:
          BASE_URL: http://localhost:5173
          E2E_ADMIN_PASSWORD: ci-test-pass-2026!
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "true"
          CI: "true"

      - name: Upload a11y results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: a11y-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  # ── Stage 3: E2E Tests (PR only) ────────────────────────────────────────
  e2e:
    name: E2E (Playwright shard ${{ matrix.shard }}/2)
    if: github.event_name == 'pull_request'
    needs: [backend-unit, frontend-unit, a11y]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      # ── Backend setup ──
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync backend dependencies
        run: uv sync --frozen --all-extras

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ── Start backend ──
      - name: Start backend server
        run: |
          mkdir -p tmp/e2e-tests tmp/e2e-artifacts
          uv run uvicorn qarunner.api.app:app --port 8000 &
        env:
          QARUNNER_DB_PATH: /tmp/qarunner-e2e.db
          QARUNNER_SECRET_KEY: ci-test-key-2026!
          QARUNNER_ADMIN_PASSWORD: ci-test-pass-2026!
          QARUNNER_TESTS_ROOT: ${{ github.workspace }}/tmp/e2e-tests
          QARUNNER_ARTIFACTS_ROOT: ${{ github.workspace }}/tmp/e2e-artifacts
          QARUNNER_CRASH_RECOVERY_ON_STARTUP: "false"

      - name: Wait for backend
        run: curl --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8000/health

      # ── Start frontend ──
      - name: Start frontend dev server
        run: npx vite --port 5173 &
        working-directory: frontend
        env:
          VITE_BACKEND_URL: http://localhost:8000

      - name: Wait for frontend
        run: curl --retry 10 --retry-delay 2 --retry-all-errors http://localhost:5173

      # ── Run E2E tests ──
      - name: Playwright E2E (shard ${{ matrix.shard }}/2)
        run: npx playwright test --shard=${{ matrix.shard }}/2
        working-directory: frontend
        env:
          BASE_URL: http://localhost:5173
          E2E_ADMIN_PASSWORD: ci-test-pass-2026!
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "true"
          CI: "true"

      # ── Artifacts ──
      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces-shard-${{ matrix.shard }}
          path: frontend/test-results/**/trace.zip
          retention-days: 7

  # Merge shard reports into one browsable HTML report
  e2e-merge-reports:
    name: E2E merged report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-shard-*
          path: frontend/all-results
          merge-multiple: true

      - name: Merge into single HTML report
        run: npx playwright merge-reports --reporter=html all-results/test-results
        working-directory: frontend

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # ── Nightly: Security Audit ─────────────────────────────────────────────
  nightly-security:
    name: Nightly security audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync backend dependencies
        run: uv sync --frozen --all-extras

      - name: Python dependency audit
        run: uv run pip-audit

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend dependency audit
        run: npm audit --audit-level=high
        working-directory: frontend
