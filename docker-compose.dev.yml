services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qarunner
      POSTGRES_USER: qarunner
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qarunner -d qarunner"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: qarunner:dev
    container_name: qarunner-backend-dev
    depends_on:
      postgres:
        condition: service_healthy
    user: root
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src
      - QARUNNER_TESTS_ROOT=/app/external_tests
      # A normal container-local path — DockerRunner no longer bind-mounts
      # cwd/results_dir into the sandbox container (it injects/extracts them
      # via put_archive/get_archive, which only needs this process's own
      # filesystem view), so this no longer has to equal a host path too.
      - QARUNNER_ARTIFACTS_ROOT=/app/artifacts
      - QARUNNER_DATABASE_BACKEND=postgres
      - QARUNNER_DATABASE_URL=postgresql://qarunner@postgres:5432/qarunner
      - QARUNNER_TEST_DATABASE_URL=postgresql://qarunner@postgres:5432/qarunner
      - QARUNNER_SECRET_KEY=${QARUNNER_SECRET_KEY:-dev_secret_key_placeholder_for_local_container_development_needs_to_be_64_chars}
      - QARUNNER_ADMIN_PASSWORD=${QARUNNER_ADMIN_PASSWORD:-admin123}
      - QARUNNER_COOKIE_SECURE=false  # Disable cookie Secure flag for local http dev (SEC-6)
      # Dev-only exception (P0-2): trusted single-host dev box, so allow non-admins
      # to use the in-process subprocess executor for convenience. Prod defaults to
      # false (docker-only for non-admins).
      - QARUNNER_ALLOW_SUBPROCESS_FOR_NON_ADMINS=true
      # Dev-only: disable login brute-force lockout (SEC-5) so exploratory curl
      # probes against :8000 don't trip the 5-strike lockout and block the
      # storageState bootstrap. Production keeps the default threshold=5.
      - QARUNNER_LOGIN_THROTTLE_THRESHOLD=0
      # Allow explicit env paths such as APP_REPO_PATH under the linked projects
      # root to be mounted read-only into docker executor containers.
      - QARUNNER_EXECUTOR_EXTRA_READONLY_ROOTS=${QARUNNER_PROJECTS_ROOT:-${HOME}/code}
      - WATCHFILES_FORCE_POLLING=true  # 兜底:bind mount 上 inotify 不传播时,强制 uvicorn --reload 走轮询
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./examples:${PWD}/examples:ro
      - ./Dockerfile:/app/Dockerfile:ro
      - ./Dockerfile.playwright:/app/Dockerfile.playwright:ro
      # Ordinary dev-convenience bind mount (persists artifacts across
      # container recreation, browsable from the host) — no host-path-identity
      # requirement anymore; see QARUNNER_ARTIFACTS_ROOT above.
      - ./artifacts:/app/artifacts
      - ./external_tests:/app/external_tests
      - ./examples/sample_playwright:/app/external_tests/sample_playwright:ro
      # This one *does* still need source==target: unlike artifacts_root, this
      # backs the real, intentional QARUNNER_EXECUTOR_EXTRA_READONLY_ROOTS
      # bind-mount-into-the-sandbox feature below (a suite referencing a local
      # project's files by path, e.g. APP_REPO_PATH) — deliberately a same-host
      # integration point, not the dev-loop coupling this file's other paths
      # used to have. No suite is hard-coded here: link a local project via
      # the UI (Add suite → local path) — it symlinks under external_tests and
      # resolves through this mount. Narrow ${QARUNNER_PROJECTS_ROOT} in .env
      # to tighten it.
      - ${QARUNNER_PROJECTS_ROOT:-${HOME}/code}:${QARUNNER_PROJECTS_ROOT:-${HOME}/code}:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  frontend:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    container_name: qarunner-frontend-dev
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      # Keep Linux container dependencies out of the macOS bind mount; optional
      # native packages such as rolldown install per OS/arch.
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_USE_POLLING=true  # Forces Vite filesystem polling to work beautifully on macOS Docker volumes
    command: >
      sh -c "test -x node_modules/.bin/vite
      || npm install --prefer-offline --no-audit --no-fund;
      npm run dev"

volumes:
  frontend_node_modules:
  postgres_data:
