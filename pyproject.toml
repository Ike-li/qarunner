[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qarunner"
version = "0.1.0"
description = "Self-hosted regression test runner: schedules pytest/Playwright suites in disposable containers, keeps full evidence, and tells you what changed since last run."
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["testing", "pytest", "playwright", "regression", "self-hosted", "test-runner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]",
    "pydantic>=2,<3",
    "pydantic-settings",
    "aiosqlite",
    "asyncpg>=0.30,<1",
    "SQLAlchemy>=2,<3",
    "Alembic>=1.18,<2",
    "allure-pytest",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "docker>=7,<8",
    "apscheduler",
    "croniter",
    "defusedxml>=0.7.1",
    "cryptography>=50.0.0",
    "httpx>=0.27,<1",
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "pip-audit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qarunner"]

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=qarunner --cov-branch --cov-report=term-missing --cov-fail-under=100 -m 'not e2e and not docker' -n auto"
markers = [
    "e2e: end-to-end smoke tests (require real allure CLI, not counted in coverage gate)",
    "docker: real-Docker integration tests (require a running daemon; opt-in via `-m docker --no-cov`, excluded from the default coverage gate)",
]

# ── coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["qarunner"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*(#.*)?$",          # Protocol method stubs (whole-line only)
    'if __name__ == "__main__":',
    "pragma: no cover",
]

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]
