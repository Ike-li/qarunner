[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qarunner"
version = "0.1.0"
description = "QA test runner — execute external pytest code, collect results, generate Allure reports"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "aiosqlite",
    "allure-pytest",
    "pyjwt",
    "bcrypt",
    "docker",
    "apscheduler",
    "croniter",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qarunner"]

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=qarunner --cov-branch --cov-report=term-missing --cov-fail-under=100 -m 'not e2e'"
markers = [
    "e2e: end-to-end smoke tests (require real allure CLI, not counted in coverage gate)",
]

# ── coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["qarunner"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",          # Protocol method stubs
    'if __name__ == "__main__":',
]

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

