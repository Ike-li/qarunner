services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile.platform
    image: qarunner-platform:latest
    container_name: qarunner-platform
    # Run as the image's non-root `app` user (uid 1000, set in Dockerfile.platform);
    # do NOT override with `user: root` (P0-2). To reach the Docker daemon socket
    # the container user must join the host's docker group — set QARUNNER_DOCKER_GID
    # to its gid (`getent group docker | cut -d: -f3`, or `stat -c %g /var/run/docker.sock`).
    # NOTE: docker-group access ≈ host root; the real isolation is that untrusted
    # test code runs in the docker executor, not the platform process (P0-2 a/b).
    # Ensure ./artifacts is writable by uid 1000 on the host.
    group_add:
      - "${QARUNNER_DOCKER_GID:?set QARUNNER_DOCKER_GID — see .env.example}"
    ports:
      - "8000:8000"
    environment:
      - QARUNNER_TESTS_ROOT=${PWD}/external_tests
      - QARUNNER_ARTIFACTS_ROOT=${PWD}/artifacts
      - QARUNNER_DB_PATH=${PWD}/artifacts/qarunner.db
      # Required — provide via a local .env (see .env.example); compose fails
      # to start if unset. Never hard-code real secrets here (SEC-2).
      - QARUNNER_SECRET_KEY=${QARUNNER_SECRET_KEY:?set QARUNNER_SECRET_KEY (see .env.example)}
      - QARUNNER_ADMIN_PASSWORD=${QARUNNER_ADMIN_PASSWORD:?set QARUNNER_ADMIN_PASSWORD (see .env.example)}
    volumes:
      - ./artifacts:${PWD}/artifacts
      # Writable suites root: the single-instance platform clones/pulls/prepares
      # /deletes git suites here (stage 2/3). source==target keeps the path
      # host-resolvable for the jail-fallback DooD bind. A named volume is NOT
      # used: the executor mounts the per-run jail (under artifacts), not this
      # root, so persistence only needs a writable host path the platform owns.
      # On a server, point ${PWD}/external_tests at a persistent dir (e.g. a
      # bind to /srv/qarunner/suites).
      - ${PWD}/external_tests:${PWD}/external_tests
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      # Readiness: /health returns 200 only when the DB round-trips (DEP-4).
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

